# CI: проверки качества на каждый pull request и каждый push в main.
#
# Всё, что здесь запускается, запускается через make — теми же командами,
# что и на машине разработчика. Workflow решает только «где и когда»,
# а «что именно проверять» записано в Makefile. Иначе появляется классика:
# «локально зелено, в CI красно», и доверие к проверкам пропадает.
#
# Правила безопасности самого workflow — в ADR-0015, коротко:
#   - только событие pull_request, никогда pull_request_target;
#   - GITHUB_TOKEN только на чтение;
#   - каждый action закреплён полным SHA коммита, тег — лишь комментарий;
#   - токен не сохраняется в .git после checkout;
#   - данные события передаются в скрипты через env, а не подстановкой ${{ }}.

name: ci

on:
  # pull_request, а не pull_request_target. Второй запускается в контексте
  # основного репозитория — с его секретами и токеном на запись, — но
  # проверяет код из PR. Любой, кто откроет PR из форка, получил бы
  # выполнение своего кода с правами нашего репозитория.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Раз в неделю — полный прогон main без всяких изменений в коде. Новые
  # уязвимости публикуются каждый день: зависимость, чистая в понедельник,
  # во вторник может оказаться уязвимой. Без этого прогона мы узнали бы
  # об этом только при следующем PR. Минута выбрана не нулевой, чтобы
  # не попадать в пик нагрузки раннеров GitHub в начале часа.
  schedule:
    - cron: "17 5 * * 1"
  # Ручной запуск из вкладки Actions — например, сразу после публикации
  # громкой уязвимости.
  workflow_dispatch:

# Права токена GITHUB_TOKEN по умолчанию для всех заданий: только чтение
# кода. Ни одному заданию здесь не нужно ничего писать в репозиторий,
# а токен с правом записи в скомпрометированном шаге — это право подменить
# код, релиз или сам этот workflow.
permissions:
  contents: read

# Новый push в тот же PR отменяет устаревший прогон: результат старого
# коммита никому не нужен, а минуты раннера и очередь — общие.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Не переключаться молча на другую версию Go: проверяем ровно ту,
  # которую поставил setup-go.
  GOTOOLCHAIN: local
  # uv не должен менять uv.lock в CI. Если lock-файл устарел относительно
  # pyproject.toml — это ошибка PR, а не повод тихо пересчитать зависимости.
  UV_LOCKED: "1"
  # Python берётся из setup-python, uv ничего не скачивает сам.
  UV_PYTHON_DOWNLOADS: never

defaults:
  run:
    # Явный bash: GitHub запускает его с "-eo pipefail", и ошибка в середине
    # конвейера команд не теряется.
    shell: bash

jobs:

  changes:
    name: какие проверки нужны
    # Версия образа раннера зафиксирована: ubuntu-latest однажды без
    # предупреждения станет новой версией Ubuntu — тот же latest, что
    # запрещён для образов контейнеров.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.decide.outputs.go }}
      python: ${{ steps.decide.outputs.python }}
      containers: ${{ steps.decide.outputs.containers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история нужна, чтобы найти точку ответвления ветки от main.
          fetch-depth: 0
          # Не оставлять токен в .git/config: иначе любой следующий шаг
          # задания, включая сторонние инструменты, может его прочитать.
          persist-credentials: false

      - name: определить изменённые части
        id: decide
        # SHA передаются через переменные окружения, а не подстановкой
        # ${{ }} прямо в команду. Подстановка вставляет значение в текст
        # скрипта до его запуска: для заголовка PR или имени ветки это
        # готовая инъекция команд. Для SHA опасности нет, но правило
        # действует везде — так его не нужно помнить в каждом случае.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_changes.py

  go:
    name: сенсор (Go)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Последний патч ветки 1.27, а не точно 1.27.0 из go.mod: патчи Go —
          # это в основном исправления безопасности, и тесты должны идти на них.
          go-version: "1.27.x"
          check-latest: true
          # Кеш собранных инструментов и модулей. Ключ — их go.sum: кеш
          # сбрасывается, как только меняется хотя бы одна зависимость.
          cache-dependency-path: tools/*/go.sum

      - name: линтеры (golangci-lint, actionlint), go.mod в порядке
        run: make lint-go lint-workflows

      - name: тесты с детектором гонок и порогом покрытия
        run: make test-go

      - name: git-хуки — настоящие коммиты во временном репозитории
        run: make test-hooks

      - name: сборка бинарника
        run: make build

      - name: уязвимости в зависимостях и стандартной библиотеке (govulncheck)
        run: make security-go

  python:
    name: control plane (Python)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: controlplane/.python-version

      # uv ставится тем же способом, что в образе control plane: из PyPI
      # с проверкой контрольных сумм. Один файл задаёт версию и для CI,
      # и для Docker, и сторонний action для этого не нужен.
      - name: установить uv
        # Блочная запись "|": в строке ":all: -r" сочетание «двоеточие и пробел»
        # YAML читает как «ключ: значение». В однострочной записи файл
        # не разбирается вовсе — это поймал actionlint.
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r deploy/docker/requirements-build.txt

      - name: зависимости строго по uv.lock
        run: make deps

      - name: ruff и mypy
        run: make lint-py

      - name: тесты с порогом покрытия
        run: make test-py test-scripts

      - name: уязвимости в зависимостях из uv.lock (pip-audit)
        run: make security-py

  containers:
    name: образы и стек
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: controlplane/.python-version

      - name: установить uv
        # Блочная запись "|": в строке ":all: -r" сочетание «двоеточие и пробел»
        # YAML читает как «ключ: значение». В однострочной записи файл
        # не разбирается вовсе — это поймал actionlint.
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r deploy/docker/requirements-build.txt

      - name: политика контейнеров
        run: make lint-containers

      # Поднимаем весь стек так же, как make dev у разработчика, и проверяем,
      # что все сервисы стали healthy. Это единственная автоматическая
      # проверка того, что стек вообще стартует с нашими ограничениями:
      # не от root, без capabilities, с файловой системой только для чтения.
      - name: собрать образы, поднять стек, проверить готовность
        run: make smoke

      - name: линтер Dockerfile (hadolint)
        run: make security-dockerfiles

      # Образы уже собраны шагом smoke, пересобирать не нужно.
      - name: уязвимости в образах (Trivy)
        run: make security-images

  # Поиск секретов не зависит от того, какие файлы изменены: секрет можно
  # положить в любой файл, включая документацию.
  secrets:
    name: секреты в истории git
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Вся история: секрет, добавленный в одном коммите PR и удалённый
          # в следующем, в итоговом состоянии файлов не виден — только в истории.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: tools/*/go.sum

      - name: gitleaks
        run: make security-secrets

  # Формат сообщений коммитов — только для pull request: на push в main
  # проверять уже поздно, а в запуске по расписанию нечего проверять.
  commits:
    name: сообщения коммитов
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Conventional Commits
        # SHA через env, как везде. Тексты коммитов скрипт печатает через
        # repr(): первая строка коммита — текст автора PR, и строка лога,
        # начинающаяся с "::", стала бы командой раннеру.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_commit_msg.py --range

  # Собственные правила Semgrep тоже запускаются всегда: правило про
  # GitHub Actions касается workflow, правила про логирование — любого кода.
  sast:
    name: собственные правила Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: тесты правил и проверка кода
        run: make security-sast

  # Единственная проверка, которую нужно сделать обязательной в защите ветки
  # main (шаг 7). Задания выше могут быть пропущены, если их часть кода
  # не менялась, а пропущенное задание нельзя сделать обязательным: PR
  # с правкой документации ждал бы его вечно.
  ci-ok:
    name: ci-ok
    needs: [changes, go, python, containers, secrets, sast, commits]
    # always(): запускаться даже если что-то упало — иначе при падении это
    # задание было бы пропущено, а пропуск засчитался бы как успех.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: все нужные проверки прошли
        env:
          CHANGES: ${{ needs.changes.result }}
          GO: ${{ needs.go.result }}
          PYTHON: ${{ needs.python.result }}
          CONTAINERS: ${{ needs.containers.result }}
          SECRETS: ${{ needs.secrets.result }}
          SAST: ${{ needs.sast.result }}
          COMMITS: ${{ needs.commits.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "changes=$CHANGES go=$GO python=$PYTHON containers=$CONTAINERS"
          echo "secrets=$SECRETS sast=$SAST commits=$COMMITS"

          # Задание changes обязано пройти. Если оно упало, все остальные
          # будут пропущены — и без этой строки пропуск выглядел бы
          # как «ничего не требовалось проверять».
          if [ "$CHANGES" != "success" ]; then
            echo "::error::не удалось определить, какие проверки нужны"
            exit 1
          fi

          # Поиск секретов и Semgrep запускаются всегда, поэтому для них
          # пропуск — тоже провал: значит, что-то сломалось в самом workflow.
          for result in "$SECRETS" "$SAST"; do
            if [ "$result" != "success" ]; then
              echo "::error::обязательная проверка безопасности завершилась с результатом $result"
              exit 1
            fi
          done

          # Для pull request проверка коммитов обязательна: её пропуск
          # означал бы ошибку в самом workflow.
          if [ "$EVENT" = "pull_request" ] && [ "$COMMITS" != "success" ]; then
            echo "::error::проверка сообщений коммитов завершилась с результатом $COMMITS"
            exit 1
          fi

          # Остальные: успех или пропуск за ненадобностью. Всё прочее —
          # failure, cancelled — провал.
          for result in "$GO" "$PYTHON" "$CONTAINERS"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::одна из проверок завершилась с результатом $result"; exit 1 ;;
            esac
          done
