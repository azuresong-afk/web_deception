# Описание проекта control plane и его зависимостей.
#
# Зачем здесь и код, и настройки всех инструментов: один файл вместо пяти
# (setup.py, requirements.txt, .flake8, mypy.ini, pytest.ini). Меньше мест,
# где настройка может незаметно разойтись с тем, что запускает CI.

[project]
name = "webdeception-cp"
version = "0.1.0"
description = "Control plane продукта web-deception"
requires-python = ">=3.12"

# Зависимости времени выполнения. Каждая обязана быть обоснована —
# это требование CLAUDE.md, а не формальность: каждая библиотека попадает
# в наш контейнер и становится частью поверхности атаки.
dependencies = [
    # FastAPI — веб-фреймворк, выбран в ADR-0002. Даёт проверку входных
    # данных по схеме из типов, что для нас не удобство, а требование
    # безопасности: непроверенный вход — источник большинства уязвимостей.
    "fastapi>=0.115,<1.0",
    # Uvicorn — ASGI-сервер, который собственно принимает соединения.
    # FastAPI сам по себе ничего не слушает. Берём без набора [standard]:
    # он тянет лишние зависимости, которые нам не нужны, а каждая
    # зависимость — это чужой код в нашем контейнере.
    "uvicorn>=0.32,<1.0",
]

[dependency-groups]
# Зависимости разработки. В контейнер не попадают — это важно:
# инструменты тестирования и линтинга в продакшене только расширяют
# поверхность атаки.
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    # Нужен тестовому клиенту FastAPI: без HTTP-клиента TestClient не работает.
    # Именно httpx2, а не httpx: starlette объявил связку с httpx устаревшей
    # и предупреждает об этом при импорте. Обе библиотеки написаны автором
    # самих starlette и uvicorn.
    "httpx2>=2.13.0",
    # Проверка зависимостей на известные уязвимости (make security). Запускается
    # по uv.lock с контрольными суммами и без установки чего-либо. Проект
    # сообщества PyPA — тех же людей, что поддерживают pip. Добавляет около
    # двадцати пакетов в группу разработки; в образ не попадает.
    "pip-audit>=2.10",
]

[tool.uv]
# Control plane — приложение, а не библиотека: его не публикуют на PyPI
# и не устанавливают как пакет. Поэтому он не собирается в пакет вовсе.
#
# Почему это вопрос безопасности, а не удобства. Сборка пакета запускает
# build backend (раньше здесь был hatchling), а build backend — это чужой код,
# который скачивается при КАЖДОЙ сборке, в любой свежей версии, и НЕ попадает
# в uv.lock: ни версия, ни контрольная сумма не закреплены. Lock-файл при этом
# создавал ложное ощущение, что вся цепочка поставки под контролем.
# Найдено на шаге 4 при сборке образа.
#
# Без сборки пакета во время установки исполняется только то, что закреплено
# в uv.lock. Код приложения подключается через PYTHONPATH=src.
package = false

# --- Форматтер и линтер ----------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # стиль по PEP 8
    "F",        # неиспользуемое и неопределённое
    "I",        # порядок импортов
    "N",        # имена по соглашению
    "UP",       # устаревшие конструкции Python
    "B",        # частые логические ошибки (bugbear)
    "S",        # проверки безопасности (bandit): небезопасные вызовы,
                # захардкоженные пароли, отключённая проверка сертификатов
    "C4",       # избыточные генераторы
    "SIM",      # упрощения
    "PTH",      # работа с путями через pathlib
    "T20",      # запрет забытых print
    "RUF",
    # Запрет не-ASCII в именах переменных, функций и импортов.
    # Это и есть настоящая защита от homoglyph-атаки: подменить
    # идентификатор похожей буквой нельзя, потому что не-ASCII имена
    # запрещены целиком.
    "PLC2401", "PLC2403",
]

ignore = [
    # RUF001-003 ищут «обманчивые» символы: кириллическую «о» рядом
    # с латинским текстом и подобное. Правило защищает от homoglyph-атаки,
    # когда злоумышленник пишет admin с кириллической «а», и читающий код
    # человек не видит подмены.
    #
    # Почему отключаем: язык проекта — русский. Комментарии, строки ошибок
    # и docstring'и написаны кириллицей по решению, а не по ошибке, поэтому
    # правило срабатывает на каждой второй строке и превращается в шум.
    # Проверка, которую все привыкли игнорировать, не защищает ни от чего.
    #
    # Чем заменили: PLC2401 и PLC2403 выше запрещают не-ASCII в именах
    # и импортах — там, где подмена буквы действительно опасна. Кириллица
    # в тексте комментария опасности не представляет: она не исполняется.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# В тестах assert — это инструмент, а не забытая отладка.
"tests/*" = ["S101"]

# --- Проверка типов --------------------------------------------------------
[tool.mypy]
python_version = "3.12"
# Код приложения не установлен как пакет, поэтому mypy ищет его в src.
mypy_path = "src"
# strict включает весь набор строгих проверок сразу. Для кода, который
# читает владелец-неразработчик, явные типы — половина документации.
strict = true
files = ["src", "tests"]

# --- Тесты и покрытие ------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Код приложения не установлен как пакет, поэтому тесты импортируют его из src.
pythonpath = ["src"]
# Строгие настройки: неизвестный маркер или предупреждение считаются ошибкой,
# иначе тесты тихо деградируют.
addopts = "--strict-markers --strict-config"
filterwarnings = [
    # Любое предупреждение — ошибка. Так устаревшие вызовы видны сразу,
    # а не через год, когда библиотека их удалит и всё сломается разом.
    # Настройка уже окупилась: она показала, что starlette просит httpx2
    # вместо httpx, и мы сменили зависимость, а не заглушили сигнал.
    "error",
    # Исключение ровно на одно предупреждение: starlette внутри своего
    # тестового клиента использует устаревший псевдоним anyio. Это чужой код,
    # исправить его мы не можем. Фильтр сформулирован узко — по тексту и типу
    # предупреждения, — чтобы он не скрыл заодно ничего другого.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/webdeception_cp"]
branch = true

[tool.coverage.report]
# Порог 80 % — выше, чем у Go (70 %), потому что Python не проверяет типы
# при запуске, и тесты здесь берут на себя часть работы компилятора.
fail_under = 80
show_missing = true
