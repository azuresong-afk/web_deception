# Стек для локальной разработки:
#   make dev       — control plane, PostgreSQL, NATS;
#   make dev-demo  — то же плюс учебная цель Juice Shop за сенсором
#                    на 127.0.0.1:8080 (ADR-0019);
#   make dev-vulnbank — то же плюс учебная цель VulnBank за сенсором
#                    на 127.0.0.1:8081.
#
# Правила, которым подчиняется каждый сервис (проверяются автоматически
# скриптом scripts/check_containers.py в `make lint`):
#   - образ закреплён по digest, тег latest запрещён;
#   - процесс работает не от root;
#   - все capabilities Linux сброшены, повышение привилегий запрещено;
#   - порты публикуются только на 127.0.0.1 хоста.

name: webdeception

# Общий блок защиты. YAML-якорь (&hardening) подставляется в сервисы
# строкой "<<: *hardening": правило, которое пишется один раз, невозможно
# забыть в одном из сервисов.
x-hardening: &hardening
  # Capabilities — это части прав root: открыть порт ниже 1024, сменить
  # владельца файла, обойти права доступа, загрузить модуль ядра. Нашим
  # сервисам не нужна ни одна, поэтому сбрасываем все.
  cap_drop: [ALL]
  # Запрещает процессу получить права больше, чем у него были при старте,
  # например через исполняемый файл с битом setuid.
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  # Без ротации лог контейнера растёт, пока не кончится диск. Бесконечный
  # поток запросов к сенсору не должен превращаться в отказ всего хоста.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Общее для всех экземпляров сенсора.
x-sensor: &sensor
  <<: *hardening
  build:
    context: ../..
    dockerfile: deploy/docker/sensor.Dockerfile
    args:
      VERSION: ${VERSION:-dev}
  image: webdeception/sensor:dev
  user: "65532:65532"
  # Корневая файловая система только для чтения: атакующий, получивший
  # выполнение кода, не сможет ни подменить бинарник, ни положить рядом свой.
  read_only: true
  # Лимиты — сдерживание отказа в обслуживании (угроза T3): утечка памяти
  # или вышедший из-под контроля процесс не утащат за собой весь хост.
  # Предел соединений сенсора по умолчанию (1024) рассчитан на этот лимит.
  mem_limit: 128m
  pids_limit: 128

services:

  # Сенсор без приложения бессмыслен, поэтому он поднимается вместе с учебной
  # целью (ADR-0019): make dev-demo — Juice Shop, make dev-vulnbank — VulnBank.
  # На каждую цель — свой экземпляр сенсора, потому что сенсор проксирует
  # ровно одно приложение. Общее у экземпляров — в якоре x-sensor ниже.
  sensor-juice:
    <<: *sensor
    profiles: [demo]
    environment:
      SENSOR_LOG_LEVEL: info
      # Внутри контейнера слушаем все интерфейсы — иначе Docker не сможет
      # пробросить порт. Граница — в строке ports ниже: на хосте порт открыт
      # только для 127.0.0.1.
      SENSOR_LISTEN_ADDR: 0.0.0.0:8080
      # Адрес приложения — только отсюда, никогда из запроса (угроза T17).
      SENSOR_UPSTREAM_URL: http://juice-shop:3000
    ports:
      - "127.0.0.1:8080:8080"
    # События переживают перезапуск контейнера. У каждого экземпляра
    # сенсора свой том: два процесса, пишущие и ротирующие один файл,
    # испортили бы его.
    volumes:
      - sensor-juice-events:/var/lib/sensor
    # edge — чтобы опубликовать порт на хост (у изолированной сети нет выхода
    # к хосту); demo-juice — чтобы дотянуться до приложения.
    networks: [edge, demo-juice]
    depends_on:
      juice-shop:
        condition: service_healthy

  sensor-vulnbank:
    <<: *sensor
    profiles: [demo-vulnbank]
    environment:
      SENSOR_LOG_LEVEL: info
      SENSOR_LISTEN_ADDR: 0.0.0.0:8080
      SENSOR_UPSTREAM_URL: http://vulnbank:5000
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - sensor-vulnbank-events:/var/lib/sensor
    networks: [edge, demo-vulnbank]
    depends_on:
      vulnbank:
        condition: service_healthy

  controlplane:
    <<: *hardening
    build:
      context: ../..
      dockerfile: deploy/docker/controlplane.Dockerfile
    image: webdeception/controlplane:dev
    user: "65532:65532"
    read_only: true
    environment:
      # Внутри контейнера слушаем все интерфейсы — иначе Docker не сможет
      # пробросить порт. Граница сети проходит не здесь, а в строке ports ниже:
      # на хосте порт открыт только для 127.0.0.1. Предупреждение в логе
      # при этом остаётся — оно честное, и мы его осознанно принимаем.
      CP_HOST: 0.0.0.0
      CP_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    # backend — к базе и очереди; edge — чтобы порт можно было опубликовать
    # на хост (у изолированной сети нет выхода к хосту).
    networks: [backend, edge]
    mem_limit: 256m
    pids_limit: 128

  postgres:
    <<: *hardening
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    # Образ по умолчанию стартует от root и понижает права сам. Мы запускаем
    # сразу от пользователя postgres (UID 70 в alpine-образе): процессу,
    # который никогда не был root, нечего «понижать».
    user: "70:70"
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    environment:
      POSTGRES_DB: webdeception
      POSTGRES_USER: webdeception
      # Пароль передаётся файлом, а не переменной окружения. Переменные
      # окружения видны в `docker inspect`, в /proc/<pid>/environ и наследуются
      # всеми дочерними процессами. Файл виден только тому, кто его читает.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username=webdeception", "--dbname=webdeception"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Только изолированная сеть: у базы нет ни выхода в интернет, ни порта на хосте.
    networks: [backend]
    mem_limit: 512m
    pids_limit: 256

  nats:
    <<: *hardening
    image: nats:2.12-alpine@sha256:b270f5e2428354c0335612694d7dd2fb588148e567a5757fdff325ef9c9332e6
    # Образ по умолчанию работает от root, своего пользователя в нём нет.
    user: "10002:10002"
    read_only: true
    volumes:
      # Своя конфигурация вместо файла из образа — см. комментарий в nats.conf.
      - ./nats.conf:/etc/nats/nats-server.conf:ro
    tmpfs:
      - /data:uid=10002,gid=10002,mode=0700
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    mem_limit: 256m
    pids_limit: 128

  # Уязвимое учебное приложение OWASP Juice Shop — цель для проверки
  # сенсора на этапе 2. Запускается только в профиле demo: make dev-demo.
  juice-shop:
    <<: *hardening
    image: bkimminich/juice-shop:v20.2.0@sha256:8739101ade29358abb5469ee66ae78e582c97ed0a5543a4ad102e5fa5193526b
    profiles: [demo]
    user: "65532:65532"
    # Файловая система НЕ только для чтения: приложение пишет свою базу и логи.
    #
    # Порт на хост не публикуется: приложение доступно только через сенсор
    # (ADR-0019). Намеренно уязвимое приложение живёт в собственной сети
    # без выхода в интернет: у него есть задания на SSRF, и взломанный
    # контейнер не должен дотянуться ни до интернета, ни до облачных
    # метаданных, ни до нашей сети backend (угроза T16).
    networks: [demo-juice]
    # В образе нет ни shell, ни curl, но есть Node.js со встроенным fetch.
    # Форма CMD со скобками запускает node напрямую, без shell.
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/rest/admin/application-version').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 3
    mem_limit: 512m
    pids_limit: 256

  # VulnBank — вторая учебная цель (ADR-0019): серверный рендеринг, HTML-формы,
  # REST, GraphQL. Намеренно уязвима — в том числе отладчик Flask (выполнение
  # кода) и SSRF, — поэтому живёт в своей сети без выхода в интернет и без
  # порта на хосте, доступна только через sensor-vulnbank (угроза T16).
  # Штатный compose автора не используется: там база открыта в сеть,
  # доступ к Docker и запуск от root.
  vulnbank:
    <<: *hardening
    # Исходники автора скачиваются в самом Dockerfile по полному SHA коммита
    # (правило D5). Обновление — вручную, см. deploy/demo/README.md.
    build:
      context: ../demo/vulnbank
    image: webdeception/demo-vulnbank:dev
    profiles: [demo-vulnbank]
    user: "10001:10001"
    read_only: true
    # Приложение пишет только загруженные файлы. Каталог — в памяти, с пределом
    # размера: загрузка файлов — одна из уязвимостей приложения, и диск хоста
    # не должен от неё пострадать.
    tmpfs:
      - /app/static/uploads:uid=10001,gid=10001,mode=0700,size=16m
      - /tmp:size=16m
    environment:
      DB_HOST: vulnbank-db
      DB_PORT: "5432"
      DB_NAME: vulnerable_bank
      DB_USER: vulnbank
    networks: [demo-vulnbank]
    depends_on:
      vulnbank-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 5
    mem_limit: 512m
    pids_limit: 256

  # Отдельная база VulnBank — не база продукта. Данные в памяти: при каждом
  # запуске приложение начинает с чистого листа.
  vulnbank-db:
    <<: *hardening
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    profiles: [demo-vulnbank]
    user: "70:70"
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
      - /var/lib/postgresql:uid=70,gid=70,mode=0700,size=256m
    environment:
      POSTGRES_DB: vulnerable_bank
      POSTGRES_USER: vulnbank
      # Пароля у учебной базы нет намеренно. Она доступна только самому
      # VulnBank в изолированной сети, а пароль, записанный в репозитории,
      # секретом бы не был — только видимостью защиты.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "--username=vulnbank", "--dbname=vulnerable_bank"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [demo-vulnbank]
    mem_limit: 256m
    pids_limit: 128

networks:
  # internal: true — у сети нет выхода наружу. Контейнеры в ней видят друг
  # друга, но не интернет. Скомпрометированная база не сможет выгрузить
  # данные на сервер атакующего напрямую.
  backend:
    internal: true
  edge: {}
  # Сети учебных целей: только цель, её сенсор (и база), без выхода в интернет.
  demo-juice:
    internal: true
  demo-vulnbank:
    internal: true

volumes:
  pgdata: {}
  sensor-juice-events: {}
  sensor-vulnbank-events: {}

secrets:
  postgres_password:
    # Файл создаётся командой `make secrets` и в git не попадает.
    file: ./secrets/postgres_password
