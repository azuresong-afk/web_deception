# Конфигурация NATS для локальной разработки.
#
# Почему свой файл, а не конфигурация из образа. Файл по умолчанию
# в официальном образе nats открывает порт кластера 6222 с паролем
# "T0pS3cr3t" — он опубликован в исходниках образа и известен всем.
# Это типичная ловушка готовых образов: настройки по умолчанию рассчитаны
# на «чтобы заработало», а не на «чтобы было безопасно».

# Порт для клиентов. Доступен только внутри изолированной сети backend
# в docker compose; наружу он не публикуется.
port: 4222

# Мониторинг — только изнутри контейнера, для проверки здоровья.
http: "127.0.0.1:8222"

# Кластера нет: один узел для разработки.

jetstream {
  # Хранилище в tmpfs: при перезапуске данные пропадают. Для шага 4 этого
  # достаточно, постоянное хранение и лимиты настраиваются на этапе 3.
  store_dir: "/data"
  max_memory_store: 64MB
  max_file_store: 256MB
}

# Аутентификации клиентов пока нет — это долг этапа 3, где появится mTLS.
# Допустимо только потому, что порт недоступен ни с хоста, ни из интернета.
