# Конфигурация golangci-lint — набора статических анализаторов для Go.
#
# Версия самого линтера и контрольные суммы всех его зависимостей закреплены
# в tools/go.mod и tools/go.sum. Запуск: make lint (или make lint-go).

version: "2"

run:
  timeout: 5m

linters:
  # Стандартный набор: errcheck (проигнорированные ошибки), govet
  # (подозрительные конструкции), ineffassign (присваивания впустую),
  # staticcheck (сотни проверок корректности), unused (мёртвый код).
  default: standard

  enable:
    # gosec — анализатор безопасности: небезопасная криптография, HTTP-серверы
    # без таймаутов, чтение файлов по пути из внешних данных, SQL из строк.
    # Для продукта безопасности это главный линтер в наборе.
    - gosec
    # Не закрытое тело HTTP-ответа — утечка соединений, а значит отказ
    # в обслуживании под нагрузкой. Для прокси это критично.
    - bodyclose
    # HTTP-запрос без context — запрос, который нельзя прервать по таймауту.
    - noctx
    # Сравнение ошибок через == вместо errors.Is ломается, как только ошибку
    # оборачивают, — а мы оборачиваем их всегда (%w).
    - errorlint
    # Возврат nil вместо ошибки, которую только что проверили, — частая
    # причина «тихих» сбоев.
    - nilerr
    - unconvert

  exclusions:
    rules:
      # В тестах допустимо то, что недопустимо в коде продукта: например,
      # HTTP-серверы из httptest без явных таймаутов.
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
