# Сканеры безопасности в контейнерах. Запускаются из Makefile (make security),
# вручную их вызывать не нужно.
#
# Почему compose, а не строка `docker run` в Makefile:
# 1. Dependabot умеет обновлять digest'ы образов в compose-файлах, но не
#    в Makefile. Устаревший сканер уязвимостей не знает о новых классах
#    уязвимостей и молча показывает «чисто».
# 2. Ограничения контейнеров записаны один раз и проверяются тем же скриптом
#    политики контейнеров, что и сам продукт (scripts/check_containers.py).
#
# Сканер видит весь исходный код проекта. Поэтому он работает так же
# ограниченно, как наши собственные сервисы, и сверх того — без сети везде,
# где сеть ему не нужна: код, который сканер прочитал, не может уйти наружу.

name: webdeception-scanners

x-scanner: &scanner
  # Все три образа по умолчанию работают от root. Make передаёт UID и GID
  # текущего пользователя, чтобы файлы кеша принадлежали ему, а не root.
  user: "${SCANNER_UID:-65534}:${SCANNER_GID:-65534}"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: [/tmp]
  environment:
    HOME: /tmp
  working_dir: /src
  mem_limit: 4g
  pids_limit: 512

services:

  # Собственные правила проекта (tools/semgrep/rules). Правила из реестра
  # Semgrep не используются: это код, загружаемый из интернета при каждом
  # запуске и без закрепления версии. Общий статический анализ делают
  # CodeQL, gosec и ruff; Semgrep — только наши правила.
  semgrep:
    <<: *scanner
    image: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
    network_mode: none
    volumes: ["../..:/src:ro"]
    entrypoint: ["semgrep"]

  # Линтер Dockerfile: запуск от root, теги latest, лишние пакеты, небезопасные
  # конструкции shell в RUN.
  hadolint:
    <<: *scanner
    image: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
    network_mode: none
    volumes: ["../..:/src:ro"]
    entrypoint: ["/bin/hadolint"]

  # Уязвимости в собранных образах: пакеты ОС базового образа, библиотеки
  # Python, стандартная библиотека и зависимости Go внутри бинарника.
  #
  # Единственный сканер с сетью: ему нужна свежая база уязвимостей.
  # Образы передаются ему файлами (docker save), а не через сокет Docker:
  # смонтированный /var/run/docker.sock — это полный контроль над хостом,
  # и давать его сканеру, который обращается в интернет, недопустимо.
  trivy:
    <<: *scanner
    image: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    volumes:
      - "../..:/src:ro"
      - "../../.cache/trivy:/cache"
    environment:
      HOME: /tmp
      TRIVY_CACHE_DIR: /cache
    entrypoint: ["trivy"]
