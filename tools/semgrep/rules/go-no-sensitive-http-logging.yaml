# Запрет логирования чувствительных данных HTTP в Go.
#
# CLAUDE.md: «Логировать тела запросов и ответов, заголовки Authorization,
# Cookie, Set-Cookie, а также токены и пароли в любом виде — запрещено».
# Угроза T4 в модели угроз: утечка паролей и персональных данных в логи.
#
# Правило работает в режиме taint — «отслеживание заражённых данных».
# Оно находит не только прямое `logger.Info("...", r.Header)`, но и путь
# через переменные: `h := r.Header; ...; logger.Info("...", h)`.
#
# Разрешено: отдельные заголовки-метаданные (User-Agent, Content-Type),
# метод, путь, код ответа. Запрещено: заголовки целиком (в них есть
# Authorization), заголовки с учётными данными, тело, cookies, строка
# параметров (в ней бывают токены), форма, полный URL (он включает параметры).

rules:
  - id: go-no-sensitive-http-logging
    languages: [go]
    severity: ERROR
    mode: taint
    message: >-
      Чувствительные данные HTTP попадают в лог: заголовки целиком, учётные
      данные, cookies, тело, параметры запроса или полный URL. Логируйте только
      метаданные (метод, путь, код ответа, отдельные безопасные заголовки).
      CLAUDE.md, раздел «Запрещено»; угроза T4.
    pattern-sources:
      # Заголовки целиком — но не обращение к одному заголовку через Get/Values:
      # безопасные заголовки вроде User-Agent логировать можно.
      - patterns:
          - pattern: $R.Header
          - pattern-not-inside: $R.Header.Get(...)
          - pattern-not-inside: $R.Header.Values(...)
      # Заголовки с учётными данными — по имени, без учёта регистра.
      - pattern: $R.Header.Get("=~/(?i)^(authorization|proxy-authorization|cookie|set-cookie|x-api-key|x-auth-token)$/")
      - pattern: $R.Header.Values("=~/(?i)^(authorization|proxy-authorization|cookie|set-cookie|x-api-key|x-auth-token)$/")
      - pattern: $R.Body
      - pattern: $R.Cookies()
      - pattern: $R.Cookie(...)
      - pattern: $R.Form
      - pattern: $R.PostForm
      - pattern: $R.URL.RawQuery
      - pattern: $R.URL.Query()
      - pattern: $R.URL.String()
      - pattern: $R.RequestURI
    pattern-sinks:
      # Запись в лог: методы логгеров slog и log, функции пакетов slog, log
      # и fmt. With — тоже сток: атрибут, прикреплённый к логгеру, попадает
      # в каждую его запись.
      - patterns:
          - pattern: $LOG.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(Debug|Info|Warn|Error|Log|LogAttrs|DebugContext|InfoContext|WarnContext|ErrorContext|With|Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
      # Сборка атрибута или значения slog заранее: атрибут с заголовками,
      # собранный заранее, — та же утечка. Только функции пакета slog, а не
      # любой метод с таким именем: String() есть у bytes.Buffer,
      # strings.Builder и многих других типов, и вызов rec.Body.String()
      # в сравнении ответа — не запись в лог. Раньше правило ловило его
      # как утечку (ложное срабатывание на этапе 2, шаг 3).
      - patterns:
          - pattern: slog.$ATTR(...)
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(Any|String|Group|AnyValue|StringValue|GroupValue)$
