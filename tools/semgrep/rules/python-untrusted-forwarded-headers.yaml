# Запрет доверия заголовкам, которые клиент может подставить сам, — Python.
# Причины и список имён те же, что в go-untrusted-forwarded-headers.yaml:
# CLAUDE.md и угроза T1. В control plane модуля доверенных прокси нет,
# поэтому исключений тоже нет.

rules:
  - id: python-untrusted-forwarded-headers
    languages: [python]
    severity: ERROR
    message: >-
      Заголовок о клиенте или исходном запросе (X-Forwarded-*, X-Real-IP
      и подобные) читается напрямую. Его может подставить любой клиент;
      доверять ему можно только от явно заданных доверенных прокси.
      CLAUDE.md, раздел «Запрещено»; угроза T1.
    pattern-either:
      - pattern: $R.headers.get("=~/(?i)^(x[-_]forwarded[-_][a-z0-9_-]+|forwarded|x[-_]real[-_]ip|true[-_]client[-_]ip|cf[-_]connecting[-_]ip|x[-_]client[-_]ip|x[-_]cluster[-_]client[-_]ip)$/", ...)
      - pattern: $R.headers["=~/(?i)^(x[-_]forwarded[-_][a-z0-9_-]+|forwarded|x[-_]real[-_]ip|true[-_]client[-_]ip|cf[-_]connecting[-_]ip|x[-_]client[-_]ip|x[-_]cluster[-_]client[-_]ip)$/"]
      - pattern: $R.headers.getlist("=~/(?i)^(x[-_]forwarded[-_][a-z0-9_-]+|forwarded|x[-_]real[-_]ip|true[-_]client[-_]ip|cf[-_]connecting[-_]ip|x[-_]client[-_]ip|x[-_]cluster[-_]client[-_]ip)$/")
