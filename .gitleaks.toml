# Конфигурация gitleaks — поиска секретов в коде и истории git.
# Запуск: make security (или make security-secrets).
#
# gitleaks ищет по всей истории, а не только в текущих файлах: секрет,
# добавленный в одном коммите и удалённый в следующем, остаётся в истории
# навсегда и для публичного репозитория считается утёкшим.

title = "web-deception"

[extend]
# Все стандартные правила: ключи облачных провайдеров, токены GitHub,
# Slack, Telegram, приватные ключи, строки подключения к базам и сотни других.
useDefault = true

# Правило по пути, без поиска содержимого. Пароли для локального стека
# генерируются случайными (scripts/gen-secrets.sh) и не имеют узнаваемого
# формата — стандартные правила их не распознают. Зато они всегда лежат
# в одном каталоге, который исключён из git. Если файл оттуда всё же
# попадёт в коммит через `git add -f`, это правило его найдёт.
[[rules]]
id = "web-deception-local-secret-file"
description = "Файл из каталога локальных секретов docker compose попал в git"
path = '''^deploy/compose/secrets/'''
